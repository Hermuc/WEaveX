[package]
name = "weave"
version = "4.13.0"
description = "WEave"
authors = ["psyattack"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "WEaveR"
path = "src/main.rs"

[lib]
name = "weave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [ "tray-icon", "image-png", "protocol-asset" ] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [ "full" ] }
reqwest = { version = "0.13.4", default-features = false, features = [ "json", "cookies", "gzip", "brotli", "form", "native-tls" ] }
# Steam depot protocol (MIT/Apache-2.0): used for the stream-while-downloading
# video pipeline. We only need chunk-level access (download_chunk / process_chunk)
# plus workshop manifest resolution; normal downloads still go through
# DepotDownloaderMod.
steamroom = "0.3"
steamroom-client = "0.3"
# steamroom's protobuf messages use prost 0.14; needed to encode/decode
# PublishedFile.GetDetails request/response in video_stream.
prost = "0.14"
# Local HTTP range server that streams video chunks on demand to an external
# player (mpv). Tiny, tokio-native, no TLS needed (loopback only).
axum = "0.8"
# join_all for concurrent CDN token requests.
futures-util = "0.3"
scraper = "0.27.0"
ego-tree = "0.11.0"
url = "2.5.8"
anyhow = "1.0.103"
thiserror = "2.0.18"
dirs = "6.0.0"
sysinfo = "0.39.5"
chrono = { version = "0.4.45", features = [ "serde" ] }
base64 = "0.22.1"
sha2 = "0.11.0"
rand = "0.10.1"
log = "0.4.33"
env_logger = "0.11.11"
regex = "1.12.4"
parking_lot = "0.12.5"
once_cell = "1.21.4"
lru = "0.18.0"
pbkdf2 = "0.13.0"
aes-gcm = "0.10.3"
zip = "8.6.0"
unrar = "0.5.8"
urlencoding = "2.1.3"
# Local QR rendering for the Steam login dialog. Generating the code in-process
# removes the dependency on an external image service (api.qrserver.com), which
# was both blocked by our own CSP img-src whitelist and frequently unreachable
# from mainland China.
qrcode = { version = "0.14", default-features = false }

# Read the Steam install path straight from the registry instead of shelling
# out to `reg.exe`. Spawning a process makes Windows take the loader lock,
# which suspends every thread in the parent for a moment — including the one
# painting the window. That was the cause of the translucent rectangle that
# flashed when the Installed view ran its first disk scan.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

# ---------------------------------------------------------------------------
# Build profiles — tuned for iteration speed on this machine.
#
# Measured on this checkout (9468 lines of Rust, 608 dependency crates):
#   cargo check --release     4 s   type-check only, no machine code
#   cargo build   (dev)      28 s   codegen, unoptimised
#   cargo build --release    58 s   codegen, opt-level=3
#
# So 85% of a full build is codegen, and `cargo check` is the fastest way to
# answer "does this still compile?" during normal editing.
#
# Things that were measured and made NO difference (do not "optimise" these):
#   * crate-type = ["rlib"] instead of [staticlib, cdylib, rlib]  → 58 s
#   * release opt-level = 1                                       → 64 s (slower)
#   * release incremental = true                                  → 58 s
#   * dependencies recompiling                                    → only 2 units built
# ---------------------------------------------------------------------------

# Development profile: drop debug symbols. They are ~30% of the build cost and
# are only needed when actually attaching a debugger.
[profile.dev]
debug = false
incremental = true

# "Ship it, but fast": optimised code without the expensive LTO pass. Useful
# when you need a real release binary to test but do not want to wait for the
# final-delivery settings.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
